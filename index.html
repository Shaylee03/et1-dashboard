<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ET1 机器人舆情 Dashboard · 银河通用</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0d0f14;color:#e8ecf3;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;line-height:1.5}
:root{--bg-card:#161b25;--bg-card2:#1e2535;--border:#2a3347;--text-sec:#8b95a8;--pos:#22c55e;--neg:#ef4444;--neu:#94a3b8;--que:#f59e0b;--bili:#fb7299;--xhs:#ff2442;--dy:#69c9d0;--blue:#3b82f6;--cyan:#06b6d4;--purple:#8b5cf6}
::-webkit-scrollbar{width:6px;height:6px}::-webkit-scrollbar-track{background:var(--bg-card)}::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
.wrap{max-width:1280px;margin:0 auto;padding:24px 16px}
.header{margin-bottom:28px;display:flex;align-items:center;gap:12px}
.logo{width:40px;height:40px;border-radius:10px;background:linear-gradient(135deg,var(--blue),var(--purple));display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
h1{font-size:22px;font-weight:700;background:linear-gradient(90deg,var(--blue),var(--cyan));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.sub{font-size:12px;color:var(--text-sec);margin-top:2px}
.kpis{display:flex;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.kpi{background:var(--bg-card);border-radius:12px;padding:18px 22px;border:1px solid var(--border);flex:1;min-width:140px}
.kpi-label{font-size:11px;color:var(--text-sec);letter-spacing:.06em;text-transform:uppercase;margin-bottom:8px}
.kpi-value{font-size:30px;font-weight:700;line-height:1}
.kpi-sub{font-size:11px;color:var(--text-sec);margin-top:5px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1.4fr;gap:16px;margin-bottom:16px}
.card{background:var(--bg-card);border-radius:12px;border:1px solid var(--border);margin-bottom:16px;overflow:hidden}
.card-head{padding:13px 16px;border-bottom:1px solid var(--border);font-size:14px;font-weight:600;display:flex;align-items:center;gap:8px}
.card-body{padding:16px}
.donut-wrap{display:flex;align-items:center;gap:16px;padding:0 16px 16px}
.legend{flex:1;min-width:0}
.legend-row{display:flex;align-items:center;gap:6px;margin-bottom:5px}
.dot{width:10px;height:10px;border-radius:2px;flex-shrink:0}
.legend-label{font-size:12px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.legend-pct{font-size:12px;color:var(--text-sec)}
.topic-row{margin-bottom:7px}
.topic-head{display:flex;justify-content:space-between;font-size:12px;margin-bottom:2px}
.topic-bar-bg{height:5px;background:#0d0f14;border-radius:3px}
.topic-bar{height:100%;border-radius:3px;transition:width .5s ease}
.filters{padding:12px 16px;border-bottom:1px solid var(--border);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.filter-group{display:flex;align-items:center;gap:6px}
.filter-label{font-size:12px;color:var(--text-sec)}
select,input{background:var(--bg-card2);border:1px solid var(--border);border-radius:6px;color:#e8ecf3;padding:4px 8px;font-size:13px;outline:none}
input{min-width:180px;padding:4px 12px}
table{width:100%;border-collapse:collapse;font-size:13px}
th{padding:8px 12px;text-align:left;color:var(--text-sec);font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;border-bottom:1px solid var(--border);white-space:nowrap;background:#0d0f14}
td{padding:8px 12px;border-bottom:1px solid var(--border)}
tr:hover td{background:var(--bg-card2)}
.tag{padding:2px 8px;border-radius:10px;font-size:11px;font-weight:600}
.pagi{padding:12px 16px;display:flex;gap:8px;align-items:center;justify-content:flex-end}
.pagi-info{font-size:12px;color:var(--text-sec);margin-right:8px}
button{padding:4px 12px;background:var(--bg-card2);border:1px solid var(--border);border-radius:6px;color:#e8ecf3;cursor:pointer;font-size:13px}
button:disabled{opacity:.4;cursor:not-allowed}
.footer{text-align:center;padding:20px 0;color:var(--text-sec);font-size:12px}
.match-count{margin-left:auto;font-size:12px;color:var(--text-sec);font-weight:400}
svg text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}
.legend-bar{display:flex;gap:12px;margin-top:6px;flex-wrap:wrap}
.legend-bar-item{display:flex;align-items:center;gap:4px;font-size:11px;color:var(--text-sec)}
.legend-bar-dot{width:10px;height:10px;border-radius:2px}
@media(max-width:768px){.grid3{grid-template-columns:1fr}.kpis{flex-direction:column}.kpi{min-width:0}}
</style>
</head>
<body>
<div class="wrap">
<div class="header">
  <div class="logo">🤖</div>
  <div>
    <h1>Galbot ET1 · 社媒舆情 Dashboard</h1>
    <div class="sub">银河通用 · B站 / 小红书 / 抖音 · WRC 首发数据</div>
  </div>
</div>
<div class="kpis" id="kpis"></div>
<div class="grid3">
  <div class="card"><div class="card-head"><span>😊</span>情感分布</div><div class="donut-wrap" id="sent-chart"></div></div>
  <div class="card"><div class="card-head"><span>📱</span>平台分布</div><div class="donut-wrap" id="plat-chart"></div></div>
  <div class="card"><div class="card-head"><span>📊</span>各平台情感对比</div><div id="grouped-bar" style="padding:0 16px 16px"></div></div>
</div>
<div class="card"><div class="card-head"><span>🏷️</span>话题热度排行 Top 12</div><div class="card-body" id="topics"></div></div>
<div class="card">
  <div class="card-head"><span>💬</span>评论浏览器<span class="match-count" id="match-count"></span></div>
  <div class="filters" id="filters"></div>
  <div style="overflow-x:auto"><table><thead><tr><th>平台</th><th>情感</th><th>话题</th><th>评论内容</th><th>点赞</th></tr></thead><tbody id="tbody"></tbody></table></div>
  <div class="pagi" id="pagi"></div>
</div>
<div class="footer">银河通用 ET1 产品组 · 舆情监控 · 数据来源：B站 / 小红书 / 抖音 · 2026-08</div>
</div>
<script>
const SENT_COLOR={"正面":"#22c55e","负面":"#ef4444","疑问/中立":"#f59e0b","中立":"#94a3b8"};
const PLAT_COLOR={"B站":"#fb7299","小红书":"#ff2442","抖音":"#69c9d0"};
const TOPIC_COLORS=["#3b82f6","#8b5cf6","#06b6d4","#22c55e","#f59e0b","#ef4444","#ec4899","#14b8a6","#f97316","#a78bfa","#84cc16","#38bdf8"];
const PAGE=20;
let rawData=[],filtered=[],page=1;
let fPlatform="全部",fSentiment="全部",fTopic="全部",fSearch="";

function donut(data,colorMap,containerId){
  const entries=Object.entries(data);
  const total=entries.reduce((s,[,v])=>s+v,0);
  const size=160,cx=80,cy=80,r=60,ri=35;
  let angle=-Math.PI/2;
  let paths='';
  entries.forEach(([label,count])=>{
    const sweep=(count/total)*Math.PI*2;
    const x1=cx+r*Math.cos(angle),y1=cy+r*Math.sin(angle);
    angle+=sweep;
    const x2=cx+r*Math.cos(angle),y2=cy+r*Math.sin(angle);
    const xi1=cx+ri*Math.cos(angle),yi1=cy+ri*Math.sin(angle);
    angle-=sweep;
    const xi2=cx+ri*Math.cos(angle),yi2=cy+ri*Math.sin(angle);
    angle+=sweep;
    const large=sweep>Math.PI?1:0;
    const d="M"+x1+" "+y1+" A"+r+" "+r+" 0 "+large+" 1 "+x2+" "+y2+" L"+xi1+" "+yi1+" A"+ri+" "+ri+" 0 "+large+" 0 "+xi2+" "+yi2+" Z";
    paths+='<path d="'+d+'" fill="'+(colorMap[label]||"#666")+'" opacity="0.9"/>';
  });
  const svgHtml='<svg width="'+size+'" height="'+size+'" style="flex-shrink:0">'+paths+'<text x="'+cx+'" y="'+(cy-4)+'" text-anchor="middle" fill="#e8ecf3" font-size="13" font-weight="700">'+total.toLocaleString()+'</text><text x="'+cx+'" y="'+(cy+14)+'" text-anchor="middle" fill="#8b95a8" font-size="10">条评论</text></svg>';
  let legendHtml='<div class="legend">';
  entries.forEach(([label,count])=>{
    const pct=((count/total)*100).toFixed(0);
    legendHtml+='<div class="legend-row"><div class="dot" style="background:'+(colorMap[label]||"#666")+'"></div><span class="legend-label">'+label+'</span><span class="legend-pct">'+pct+'%</span></div>';
  });
  legendHtml+='</div>';
  document.getElementById(containerId).innerHTML=svgHtml+legendHtml;
}

function groupedBar(data,containerId){
  const platforms=Object.keys(data);
  const sentiments=["正面","负面","疑问/中立","中立"];
  let maxVal=0;
  platforms.forEach(p=>sentiments.forEach(s=>{const v=(data[p][s]||0);if(v>maxVal)maxVal=v;}));
  if(!maxVal)return;
  const barW=18,gap=4,groupW=sentiments.length*(barW+gap),groupGap=28;
  const chartW=platforms.length*(groupW+groupGap)-groupGap+48,chartH=140,padL=42;
  let bars='';
  const gridLines=[0,0.25,0.5,0.75,1];
  gridLines.forEach(t=>{
    const y=chartH-t*chartH;
    bars+='<line x1="'+padL+'" y1="'+y+'" x2="'+chartW+'" y2="'+y+'" stroke="#2a3347" stroke-width="0.5"/>';
    bars+='<text x="'+(padL-4)+'" y="'+(y+4)+'" text-anchor="end" fill="#8b95a8" font-size="9">'+Math.round(t*maxVal)+'</text>';
  });
  platforms.forEach((platform,pi)=>{
    const gx=padL+pi*(groupW+groupGap);
    sentiments.forEach((s,si)=>{
      const val=(data[platform][s]||0);
      const bh=(val/maxVal)*chartH,bx=gx+si*(barW+gap),by=chartH-bh;
      bars+='<rect x="'+bx+'" y="'+by+'" width="'+barW+'" height="'+bh+'" fill="'+SENT_COLOR[s]+'" rx="2" opacity="0.85"/>';
      if(bh>14)bars+='<text x="'+(bx+barW/2)+'" y="'+(by+12)+'" text-anchor="middle" fill="#fff" font-size="9" font-weight="600">'+val+'</text>';
    });
    bars+='<text x="'+(gx+groupW/2-(barW+gap)/2)+'" y="'+(chartH+18)+'" text-anchor="middle" fill="'+(PLAT_COLOR[platform]||"#e8ecf3")+'" font-size="13" font-weight="600">'+platform+'</text>';
  });
  let legendHtml='<div class="legend-bar">';
  Object.entries(SENT_COLOR).forEach(([s,c])=>{
    legendHtml+='<div class="legend-bar-item"><div class="legend-bar-dot" style="background:'+c+'"></div>'+s+'</div>';
  });
  legendHtml+='</div>';
  document.getElementById(containerId).innerHTML='<svg width="'+chartW+'" height="'+(chartH+32)+'" style="overflow:visible">'+bars+'</svg>'+legendHtml;
}

function renderTopics(topicCount){
  const entries=Object.entries(topicCount).sort((a,b)=>b[1]-a[1]).slice(0,12);
  const max=entries[0]?.[1]||1;
  let html='';
  entries.forEach(([topic,count],i)=>{
    const pct=(count/max*100).toFixed(0);
    html+='<div class="topic-row"><div class="topic-head"><span style="display:flex;align-items:center;gap:6px"><span style="width:6px;height:6px;border-radius:50%;background:'+TOPIC_COLORS[i%TOPIC_COLORS.length]+';display:inline-block"></span>'+topic+'</span><span style="color:#8b95a8">'+count+'</span></div><div class="topic-bar-bg"><div class="topic-bar" style="width:'+pct+'%;background:'+TOPIC_COLORS[i%TOPIC_COLORS.length]+'"></div></div></div>';
  });
  document.getElementById('topics').innerHTML=html;
}

function renderKPIs(stats){
  const {total,sentiment,platform}=stats;
  const pos=sentiment["正面"]||0,neg=sentiment["负面"]||0;
  const bili=platform["B站"]||0;
  const kpis=[
    {label:"有效评论总量",value:total.toLocaleString(),sub:"去除明星粉丝内容后"},
    {label:"正面情感",value:total?((pos/total)*100).toFixed(1)+"%":"0%",sub:pos.toLocaleString()+" 条",color:"#22c55e"},
    {label:"负面情感",value:total?((neg/total)*100).toFixed(1)+"%":"0%",sub:neg.toLocaleString()+" 条",color:"#ef4444"},
    {label:"最高讨论平台",value:"B站",sub:(total?((bili/total)*100).toFixed(0):0)+"% 占比",color:"#fb7299"},
  ];
  document.getElementById('kpis').innerHTML=kpis.map(k=>'<div class="kpi"><div class="kpi-label">'+k.label+'</div><div class="kpi-value" style="color:'+(k.color||"#e8ecf3")+'">'+k.value+'</div>'+(k.sub?'<div class="kpi-sub">'+k.sub+'</div>':'')+'</div>').join('');
}

function computeStats(data){
  const platform={},sentiment={},platformSentiment={},topicCount={};
  data.forEach(row=>{
    platform[row[0]]=(platform[row[0]]||0)+1;
    sentiment[row[1]]=(sentiment[row[1]]||0)+1;
    if(!platformSentiment[row[0]])platformSentiment[row[0]]={};
    platformSentiment[row[0]][row[1]]=(platformSentiment[row[0]][row[1]]||0)+1;
    row[2].split(/[、,]/).forEach(t=>{t=t.trim();if(t&&t!=="其他"&&t!=="明星粉丝"){topicCount[t]=(topicCount[t]||0)+1;}});
  });
  return{total:data.length,platform,sentiment,platformSentiment,topicCount};
}

function buildFilters(data){
  const topics=new Set();
  data.forEach(row=>row[2].split(/[、,]/).forEach(t=>{t=t.trim();if(t&&t!=="其他"&&t!=="明星粉丝")topics.add(t);}));
  const topicList=Array.from(topics).sort();
  let html='';
  const platOpts=["全部","B站","小红书","抖音"];
  const sentOpts=["全部","正面","负面","疑问/中立","中立"];
  html+='<div class="filter-group"><span class="filter-label">平台:</span><select id="fp" onchange="setFilter(0,this.value)">'+platOpts.map(o=>'<option>'+o+'</option>').join('')+'</select></div>';
  html+='<div class="filter-group"><span class="filter-label">情感:</span><select id="fs" onchange="setFilter(1,this.value)">'+sentOpts.map(o=>'<option>'+o+'</option>').join('')+'</select></div>';
  html+='<div class="filter-group"><span class="filter-label">话题:</span><select id="ft" onchange="setFilter(2,this.value)"><option>全部</option>'+topicList.map(t=>'<option>'+t+'</option>').join('')+'</select></div>';
  html+='<input type="text" placeholder="搜索评论…" oninput="setSearch(this.value)" id="fsearch">';
  document.getElementById('filters').innerHTML=html;
}

function setFilter(idx,val){
  if(idx===0)fPlatform=val;
  else if(idx===1)fSentiment=val;
  else fTopic=val;
  page=1;applyFilter();
}
function setSearch(val){fSearch=val;page=1;applyFilter();}

function applyFilter(){
  filtered=rawData.filter(row=>{
    if(fPlatform!=="全部"&&row[0]!==fPlatform)return false;
    if(fSentiment!=="全部"&&row[1]!==fSentiment)return false;
    if(fTopic!=="全部"&&!row[2].includes(fTopic))return false;
    if(fSearch&&!row[3].toLowerCase().includes(fSearch.toLowerCase()))return false;
    return true;
  });
  renderTable();
}

function renderTable(){
  const total=filtered.length;
  document.getElementById('match-count').textContent=total.toLocaleString()+" 条匹配";
  const pageData=filtered.slice((page-1)*PAGE,page*PAGE);
  const totalPages=Math.ceil(total/PAGE);
  let rows='';
  pageData.forEach(row=>{
    const platColor=PLAT_COLOR[row[0]]||"#e8ecf3";
    const sentColor=SENT_COLOR[row[1]]||"#8b95a8";
    const likes=row[4]>0?'👍 '+row[4]:'—';
    const likesStyle=row[4]>0?'color:#06b6d4;font-weight:600':'color:#8b95a8';
    rows+='<tr><td><span style="color:'+platColor+';font-weight:600">'+row[0]+'</span></td>';
    rows+='<td><span class="tag" style="background:'+sentColor+'22;color:'+sentColor+'">'+row[1]+'</span></td>';
    rows+='<td style="max-width:160px;color:#8b95a8;font-size:11px">'+row[2]+'</td>';
    rows+='<td style="max-width:480px">'+row[3].replace(/</g,'&lt;').replace(/>/g,'&gt;')+'</td>';
    rows+='<td style="white-space:nowrap;'+likesStyle+'">'+likes+'</td></tr>';
  });
  if(!rows)rows='<tr><td colspan="5" style="padding:32px;text-align:center;color:#8b95a8">没有匹配的评论</td></tr>';
  document.getElementById('tbody').innerHTML=rows;
  let pagi='';
  if(totalPages>1){
    pagi='<span class="pagi-info">第 '+page+' / '+totalPages+' 页</span>';
    pagi+='<button onclick="changePage(-1)"'+(page===1?' disabled':'')+'>上一页</button>';
    pagi+='<button onclick="changePage(1)"'+(page===totalPages?' disabled':'')+'>下一页</button>';
  }
  document.getElementById('pagi').innerHTML=pagi;
}

function changePage(dir){page=Math.max(1,Math.min(Math.ceil(filtered.length/PAGE),page+dir));renderTable();}

function init(data){
  rawData=data;
  filtered=[...rawData];
  const stats=computeStats(rawData);
  renderKPIs(stats);
  donut(stats.sentiment,SENT_COLOR,'sent-chart');
  donut(stats.platform,PLAT_COLOR,'plat-chart');
  groupedBar(stats.platformSentiment,'grouped-bar');
  renderTopics(stats.topicCount);
  buildFilters(rawData);
  renderTable();
}
